[project]
name = "async3status"
version = "0.1.0"
description = "Async event-driven i3/sway status bar framework"
authors = [
    { name = "Frank Hermann", email = "frank.hermann@posteo.de" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "pulsectl>=23.11.1",
    "asyncinotify"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src/async3status"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
